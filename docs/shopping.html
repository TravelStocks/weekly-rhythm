<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f7f2"><title>每周采购清单 · Raymond</title><link rel="stylesheet" href="shopping.css"></head><body>
<div class="page"><nav><a href="index.html">← 技能与固定日历</a><a href="monthly.html">月度复盘</a><a href="quarterly.html">季度复盘</a></nav><header><div><div class="eyebrow">给新的一周，备好日常。</div><h1>每周采购清单<span>饮食和药物</span></h1><p>先看库存，再补所需。采购完成后勾选，下周继续使用这份清单。</p></div><button class="primary" id="add">＋ 添加物品</button></header>
<div class="shopping-plan"><span class="plan-icon">↻</span><div><strong>周六 · 财务梳理之后</strong><p>采购、生活补给建议安排在 11:30–13:00，按实际路程调整。</p></div><a href="index.html">查看日历 ↗</a></div>
<div class="overview"><div><span class="eyebrow">本轮采购</span><strong id="progress-text">0 / 29</strong><span id="progress-sub">项已完成</span></div><div class="progress-track"><div id="progress-fill"></div></div><button id="reset">开始新一轮</button><button id="undo" disabled>↶ 撤销</button></div>
<div class="controls"><div class="filters" aria-label="物品筛选"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="food" aria-pressed="false">饮食</button><button data-filter="medicine" aria-pressed="false">药物</button><button data-filter="pending" aria-pressed="false">未完成</button></div><input id="search" type="search" aria-label="搜索物品" placeholder="搜索物品…"></div>
<main id="groups" aria-label="采购清单"></main><p id="empty" hidden>没有符合条件的物品。</p>
<footer><span id="save-status" role="status">当前浏览器自动保存</span><div><button id="export">导出备份</button><button id="import">导入备份</button><input type="file" id="import-file" accept="application/json,.json" hidden><button id="print">打印清单</button></div></footer></div>
<dialog id="item-dialog"><button class="close" aria-label="关闭编辑">×</button><h2 id="dialog-title">添加物品</h2><form id="item-form"><label>物品名称<input id="item-name" required maxlength="100"></label><div class="form-row"><label>分类<select id="item-group"><option value="fruit">水果</option><option value="nuts">坚果与籽粉</option><option value="vegetables">蔬菜与主食</option><option value="dairy">奶与酸奶</option><option value="medicine">药物</option></select></label><label>采购数量<input id="item-quantity" maxlength="80" placeholder="如：2盒 / 按库存"></label></div><label>备注<textarea id="item-note" rows="3" maxlength="1000" placeholder="规格、库存或需要确认的信息"></textarea></label><label class="check-label"><input id="item-confirm" type="checkbox">名称 / 规格待确认</label><p id="form-error" role="alert"></p><div class="form-bottom"><button type="button" class="danger" id="delete">删除物品</button><div><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></div></form></dialog><div class="toast" id="toast" role="status"></div><script type="module" src="shopping.js"></script></body></html>
